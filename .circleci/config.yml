version: 2.1

orbs:
  aws-cli: circleci/aws-cli@3.1.4

jobs:
  deploy:
    docker:
      - image: cimg/python:3.10  
    steps:
      - checkout

      - run:
          name: Install AWS CLI
          command: |
            sudo apt-get update
            sudo apt-get install -y unzip curl
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install
            aws --version

      - run:
          name: Fetch full git history (for diff)
          command: |
            git fetch --unshallow || true

      - run:
          name: Deploy Lambdas on folder changes
          command: |
            # Lambda function names
            DATA_CLEAN_FN="clairvoy-dev-data-clean-lambda"
            DATA_LOAD_FN="clairvoy-dev-data-load-lambda"
            DATA_PREP_FN="clairvoy-dev-data-prep-and-upload-lambda"
            LAYER_NAME="clairvoy-dev-lambda-dependencies"

            # Get changed files
            CHANGED_FILES=$(git diff --name-only $CIRCLE_SHA1 $CIRCLE_SHA1~1)
            echo "Changed files:"
            echo "$CHANGED_FILES"

            # Deploy data_clean Lambda
            if echo "$CHANGED_FILES" | grep -q "^data_clean/"; then
              echo "Deploying data_clean lambda..."
              cd data_clean
              zip -r ../data_clean.zip .
              cd ..
              aws lambda update-function-code \
                --function-name $DATA_CLEAN_FN \
                --zip-file fileb://data_clean.zip \
                --region $AWS_DEFAULT_REGION
            fi

            # Deploy data_load Lambda
            if echo "$CHANGED_FILES" | grep -q "^data_load/"; then
              echo "Deploying data_load lambda..."
              cd data_load
              zip -r ../data_load.zip .
              cd ..
              aws lambda update-function-code \
                --function-name $DATA_LOAD_FN \
                --zip-file fileb://data_load.zip \
                --region $AWS_DEFAULT_REGION
            fi

            # Deploy data_prep Lambda
            if echo "$CHANGED_FILES" | grep -q "^data_prep/"; then
              echo "Deploying data_prep lambda..."
              cd data_prep
              zip -r ../data_prep.zip .
              cd ..
              aws lambda update-function-code \
                --function-name $DATA_PREP_FN \
                --zip-file fileb://data_prep.zip \
                --region $AWS_DEFAULT_REGION
            fi

            # Update Lambda Layer
            if echo "$CHANGED_FILES" | grep -q "^lambda_layer.zip$"; then
              echo "Publishing new Lambda layer version..."
              aws lambda publish-layer-version \
                --layer-name $LAYER_NAME \
                --zip-file fileb://lambda_layer.zip \
                --region $AWS_DEFAULT_REGION

              # Get latest layer version ARN
              LAYER_VERSION_ARN=$(aws lambda list-layer-versions \
                --layer-name $LAYER_NAME \
                --query 'LayerVersions[0].LayerVersionArn' \
                --output text \
                --region $AWS_DEFAULT_REGION)

              echo "Updating all lambdas to use new layer version: $LAYER_VERSION_ARN"

              for fn in $DATA_CLEAN_FN $DATA_LOAD_FN $DATA_PREP_FN; do
                aws lambda update-function-configuration \
                  --function-name "$fn" \
                  --layers "$LAYER_VERSION_ARN" \
                  --region $AWS_DEFAULT_REGION
              done
            fi

workflows:
  version: 2
  deploy_on_push:
    jobs:
      - deploy:
          filters:
            branches:
              only: circleci-project-setup
