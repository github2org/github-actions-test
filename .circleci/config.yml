version: 2.1

jobs:
  build_lambda_layer:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout

      - run:
          name: Check Docker CLI version
          command: docker --version

      - run:
          name: Install AWS CLI v2 if missing
          command: |
            if ! command -v aws >/dev/null 2>&1; then
              echo "AWS CLI not found, installing..."
              curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
              unzip awscliv2.zip
              sudo ./aws/install --update
            else
              echo "AWS CLI already installed"
            fi
            aws --version

      - run:
          name: Install jq (JSON parser)
          command: |
            sudo apt-get update
            sudo apt-get install -y jq

      - run:
          name: Build Lambda Layer
          command: |
            chmod +x build_layer.sh
            ./build_layer.sh

      - run:
          name: Publish Lambda Layer Version
          command: |
            output=$(aws lambda publish-layer-version \
              --layer-name your-layer-name \
              --description "Updated lambda layer from CircleCI" \
              --zip-file fileb://lambda_layer.zip \
              --compatible-runtimes python3.13)

            echo "$output"

            layer_arn=$(echo "$output" | jq -r '.LayerVersionArn')

            echo "Published new layer version ARN: $layer_arn"

            echo "export LAYER_ARN=$layer_arn" >> $BASH_ENV

      - run:
          name: Update Lambda Function with New Layer (Optional)
          command: |
            # Uncomment and replace your-function-name if you want to update the Lambda function here
            # aws lambda update-function-configuration \
            #   --function-name your-function-name \
            #   --layers "$LAYER_ARN"

workflows:
  version: 2
  build:
    jobs:
      - build_lambda_layer







